# Local Docker orchestration for balance. NOT the production deploy path — Kamal
# owns that (config/deploy.yml). This collapses the manual `docker network create`
# + multiple `docker run` dance into one command, and lets us run two rungs of
# fidelity against a shared Postgres:
#
#   docker compose up                          -> dev stack on http://localhost:8080
#                                                 (RAILS_ENV=development, code bind-mounted, live reload)
#   docker compose --profile prod up --build   -> production image on http://localhost:8080
#                                                 (the real top-level Dockerfile, RAILS_ENV=production)
#
# "Staging" is not a separate service: locally it would be this same prod image
# with a different .env and port, so it is intentionally omitted.
#
# `docker compose up --build` starts the development stack without requiring an
# environment file. The production image remains opt-in through its profile.

name: balance

services:
  # Shared Postgres for both rungs. POSTGRES_USER becomes a superuser, which lets
  # the prod image's entrypoint (bin/docker-entrypoint -> db:prepare) create the
  # extra cache/queue/cable databases on first boot. Matches the `balance` role
  # that config/database.yml connects as in production.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: ${BALANCE_DATABASE_PASSWORD:-balance_dev_password}
      POSTGRES_DB: balance_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d targets an existing database; without it pg_isready probes a db named
      # after the user ("balance"), which doesn't exist and floods the log with
      # FATAL "database does not exist" every interval.
      test: ["CMD-SHELL", "pg_isready -U balance -d balance_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Rung 1 — development convenience. Code is bind-mounted for live reload and
  # Rails prepares its primary, queue, and cable databases before bin/dev starts.
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      BINDING: "0.0.0.0"
      DATABASE_URL: postgres://balance:${BALANCE_DATABASE_PASSWORD:-balance_dev_password}@postgres:5432/balance_development
      QUEUE_DATABASE_URL: postgres://balance:${BALANCE_DATABASE_PASSWORD:-balance_dev_password}@postgres:5432/balance_development_queue
      CABLE_DATABASE_URL: postgres://balance:${BALANCE_DATABASE_PASSWORD:-balance_dev_password}@postgres:5432/balance_development_cable
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.5-35b-a3b}
    command: bash -c "bin/rails db:prepare && bin/dev"
    ports:
      - "8080:3000"
    volumes:
      - .:/rails
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Rung 2 — run the real production image locally to catch prod-only bugs
  # (missing deps, asset precompile failures, env-var wiring) without deploying.
  # RAILS_MASTER_KEY is injected as an env var (the same mechanism Kamal uses) so
  # Rails can decrypt credentials for secret_key_base. It comes from .env — set it
  # to the contents of config/master.key (see .env.example). The dev stack never
  # reads it, so it stays optional here and only this profile needs it. force_ssl is off in
  # production.rb, so this serves plain HTTP locally with no redirect loop.
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      DB_HOST: postgres
      BALANCE_DATABASE_PASSWORD: ${BALANCE_DATABASE_PASSWORD:-balance_dev_password}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
