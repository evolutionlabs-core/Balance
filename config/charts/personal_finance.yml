key: personal_finance
name: Personal Finance Chart
description: Cash-aware double-entry chart for individuals
accounts:
  # --- Assets (1xxx)
  - { code: "1010", name: Cash,                base_type: asset,     subtype: cash,        normal_balance: debit }
  - { code: "1020", name: Checking Account,    base_type: asset,     subtype: cash,        normal_balance: debit }
  - { code: "1030", name: Savings Account,     base_type: asset,     subtype: cash,        normal_balance: debit }
  - { code: "1100", name: Investments,         base_type: asset,     subtype: investment,  normal_balance: debit }
  - { code: "1200", name: Property,            base_type: asset,     subtype: fixed_asset, normal_balance: debit }
  # --- Liabilities (2xxx)
  - { code: "2010", name: Credit Card,         base_type: liability, subtype: credit_card, normal_balance: credit }
  - { code: "2100", name: Mortgage Payable,    base_type: liability, subtype: loan,        normal_balance: credit }
  - { code: "2200", name: Auto Loan,           base_type: liability, subtype: loan,        normal_balance: credit }
  # --- Equity (3xxx)
  - { code: "3010", name: Contributions,       base_type: equity,    subtype: owner_equity, normal_balance: credit }
  - { code: "3020", name: Personal Spending,   base_type: equity,    subtype: owner_draws,  normal_balance: debit }
  - { code: "3900", name: Retained Earnings,      base_type: equity,    subtype: retained_earnings,      normal_balance: credit, system: true }
  - { code: "3990", name: Opening Balance Equity, base_type: equity,    subtype: opening_balance_equity, normal_balance: credit, system: true }
  # --- Revenue (4xxx)
  - { code: "4010", name: Salary,              base_type: income,    subtype: salary,       normal_balance: credit }
  - { code: "4090", name: Other Income,        base_type: income,    subtype: other,        normal_balance: credit }
  # --- Expenses (5xxx)
  - { code: "5010", name: Housing,             base_type: expense,   subtype: housing,      normal_balance: debit }
  - { code: "5020", name: Groceries,           base_type: expense,   subtype: groceries,    normal_balance: debit }
  - { code: "5900", name: Other Expense,       base_type: expense,   subtype: other_expense, normal_balance: debit }
